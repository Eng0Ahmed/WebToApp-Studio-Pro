name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Standalone EXE
      run: |
        python -m PyInstaller --name "WebToApp Studio Pro" --onefile --windowed --add-data "templates;templates" --collect-all customtkinter main.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v3
      with:
        name: WebToApp-Studio-Pro-EXE
        path: dist/WebToApp Studio Pro.exe
